- type: entity
  parent: FloorRitualChasmEntity
  id: STDAFloorRitualChasmEntity
  name: chasm
  description: The darkness inside is blinding.
  suffix: STDA, Ritual Chasm, No Stun
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  # Chasm
  - type: RitualChasm
    throwSound: /Audio/_Stalker/Effects/springboard_blowout.ogg
    relocateSound:
      params:
        volume: -4
      collection: StalkerHorrorSound
    relocatedLocalSound:
      params:
        volume: 8
        pitch: 0.7
      path: /Audio/_Stalker_EN/Effects/psivoice3.ogg #/Audio/Effects/Gasp/gasp_male2.ogg
    fallSound:
      params:
        volume: 6
      path: /Audio/_Stalker_EN/Effects/fall_impact.ogg
    fallEmote: Scream
    relocatedLocalPopup: ritual-chasm-relocated-popup
    relocatedStunDuration: 0
    relocatedFlashDuration: 1
    throwForce: 15
    rewardedPerTier: 0
    rewardedPerTooth: 0
    relocatableEntities:
      components:
      - Body
    punishedEntities:
      tags:
      - STFleshRelated

- type: entity
  parent: RitualChasmExitPointMarker
  id: STDADeathmatchRitualChasmExitPointMarker
  suffix: Anom-blocker, 10 tiles
  components:
  - type: STAnomalyGeneratorSpawnBlocker
    size: 10
  # - type: EmissionLightningSpawnBlocker
  #   radius: 10
